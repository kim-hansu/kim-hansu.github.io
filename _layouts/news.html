---
layout: default
---

<div class="post">

  <!-- Page title -->
  <h1 class="post-title" style="text-align: center;">{{ page.title }}</h1>
  <div class="post-line"></div>

  <!-- News list -->
  <div class="catalogue">

    {% assign posts = site.tags[page.tag] %}

    {% if posts %}

      {% for post in posts %}

        {% include catalogue_item.html %}

      {% endfor %}

    {% else %}

      <p>No posts found.</p>

    {% endif %}

  </div>

</div>

{% if page.show_top != false %}
<div class="pagination">
  <a href="#" class="top">Top</a>
</div>
{% endif %}
