---
layout: default
---

<h1>{{ page.title }}</h1>

<div class="news">

  {% assign posts = site.tags[page.tag] %}

  {% for post in posts %}

    <a class="news-item" href="{{ post.url | relative_url }}">
      <div class="title">{{ post.title }}</div>
      <div class="date">{{ post.date | date: "%Y-%m-%d" }}</div>
    </a>

  {% endfor %}

</div>
