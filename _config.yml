# Site settings
title:          CODE Lab
description:    "CODE Lab at Gachon University"
baseurl:        ""
url:            "https://codelab.gachon.ac.kr"

# Google Analytics
google_analytics: G-RT7GSR06M6

# Author
author:
  name:         Hansu Kim
  url:          https://codelab.gachon.ac.kr
  email:        hansukim@gachon.ac.kr

# Build settings
markdown:       kramdown
include:
  - _pages

# Assets
sass:
  sass_dir:     _sass
  style:        compressed

# Gems
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap
  # - jemoji #Uncomment this to allow emoji in your post

# Permalinks
permalink:      /:year-:month-:day/:title
paginate:       5

# Excludes
exclude: [ Gemfile, Gemfile.lock, tale.gemspec ]
